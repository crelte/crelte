name: Publish Package

on:
  push:
    tags:
      - '*@v*.*.*' # Trigger on tags like crelte@v1.0.1, cli@v1.2.0

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read # Allow reading the repository content
      id-token: write # Required for provenance and JSR authentication
    container:
      image: node:24

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Parse Tag
        id: parse_tag
        run: |
          # Extract the tag name (e.g., crelte@v1.2.0)
          TAG_NAME="${GITHUB_REF##*/}"
          PACKAGE_SHORT_NAME="${TAG_NAME%@*}"
          VERSION="${TAG_NAME#*@}"
          echo "PACKAGE_SHORT_NAME=${PACKAGE_SHORT_NAME}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "PACKAGE_FOLDER=packages/${PACKAGE_SHORT_NAME}" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      # install latest npm for Trusted Publishing
      - run: npm install -g npm@latest

      - name: Install Dependencies
        run: npm ci

      # we build each package so all dependencies are met
      - name: Build
        run: npm run build

      - name: Check errors
        run: |
          cd ${PACKAGE_FOLDER}
          npm run check

      - name: Run lint
        run: |
          cd ${PACKAGE_FOLDER}
          npm run lint

      - name: Publish to npm
        shell: bash
        run: |
          cd ${PACKAGE_FOLDER} # Navigate to the correct package folder
          echo "Publishing package from ${PACKAGE_FOLDER} with version ${VERSION}"

          # Check if the version is a prerelease (contains a hyphen, e.g., v0.6.0-alpha.0)
          if [[ "${VERSION}" == *-* ]]; then
            # Extract the identifier (gets 'alpha' from 'v0.6.0-alpha.0' or 'rc' from 'v1.0.0-rc.1')
            DIST_TAG=$(echo "${VERSION}" | awk -F'-' '{print $2}' | awk -F'.' '{print $1}')

            # Fallback to 'next' if extraction is empty
            if [[ -z "${DIST_TAG}" ]]; then
              DIST_TAG="next"
            fi

            echo "Prerelease detected. Publishing with --tag ${DIST_TAG}"
            npm publish --provenance --tag ${DIST_TAG}
          else
            echo "Stable release detected. Publishing to latest tag."
            npm publish --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # Ensure you are passing your auth token
